[project]
name = "wald-inference"
version = "0.4.1"
description = "Pure-Python utilities for documented one-parameter Wald inference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Brian Locke" },
]
maintainers = [
  { name = "Brian Locke" },
]
keywords = [
  "wald-inference",
  "confidence-interval",
  "compatibility-curve",
  "relative-likelihood",
  "type-s-error",
  "type-m-error",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.2.5,<2.3",
  "scipy>=1.17.1,<1.18",
]

[project.urls]
Repository = "https://github.com/reblocke/wald-inference-core"
Issues = "https://github.com/reblocke/wald-inference-core/issues"
Changelog = "https://github.com/reblocke/wald-inference-core/blob/main/CHANGELOG.md"
Documentation = "https://github.com/reblocke/wald-inference-core/blob/main/docs/API.md"
Releases = "https://github.com/reblocke/wald-inference-core/releases"

[dependency-groups]
build = [
  "setuptools==83.0.0",
]
dev = [
  "hypothesis>=6.151,<7",
  "pytest>=8.2",
  "ruff>=0.15.1",
]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wald_inference = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-q"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["wald_inference"]
