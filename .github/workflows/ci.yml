name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --all-groups

      - name: Ruff format check
        run: make fmt-check

      - name: Ruff lint
        run: make lint

      - name: Verify release metadata
        run: make metadata-check

      - name: Run unit, property, reference, and regression tests
        run: make test

      - name: Verify frozen baseline parity
        run: make parity

      - name: Build and inspect wheel and sdist
        run: make build

      - name: Cold-wheel smoke
        run: make smoke

      - name: Verify clean tracked state
        shell: bash
        run: |
          git diff --check
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi

      - name: Upload parity report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-parity
          path: reports/baseline-parity.json
          if-no-files-found: error
          retention-days: 14
