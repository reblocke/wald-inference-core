version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Denver"
    # These versions are outside the released scientific/runtime compatibility ceilings.
    ignore:
      - dependency-name: "numpy"
        versions:
          - ">=2.3"
      - dependency-name: "scipy"
        versions:
          - ">=1.15"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Denver"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
